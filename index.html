<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juquinha - Pizza em Pedaços</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">
        <img src="img/Logo_opcao1-removebg-preview.png" alt="Logo Juquinha" />
      </div>
      <nav>
        <ul>
          <li><a href="#">HOME</a></li>
          <li><a href="#">QUEM SOMOS?</a></li>
          <li><a href="#">CARDÁPIO</a></li>
          <li><a href="#">INFORMAÇÕES</a></li>
        </ul>
      </nav>
    </div>
  </header>
 
  <main class="container">
    <section class="hero">
      <img src="img/R (1).jpg" alt="Pizza em destaque" class="hero-image" />
      <div class="cta">
        <p>FAÇA SEU PEDIDO PELO NÚMERO:</p>
        <a href="tel:+5513999999999">(13) 9999-9999</a>
      </div>
    </section>
 
    <section class="galeria">
      <img src="pizza1.jpg" alt="Pizza 1" />
      <img src="pizza2.jpg" alt="Pizza 2" />
      <img src="pizza3.jpg" alt="Pizza 3" />
    </section>
  </main>
 
  <footer>
    <div class="container footer-container">
      <div class="logo-footer">
        <img src="logo-footer.png" alt="Logo Juquinha Pizzaria" />
      </div>
      <div class="endereco">
        <p>Av. Conselheiro Nébias, 309 - Vila Matias, Santos - SP, 11015-003</p>
      </div>
      <div class="contato">
        <p>Fale Conosco:<br><a href="tel:+5513999999999">(13) 9999-9999</a></p>
        <img src="instagram-icon.png" alt="Instagram" class="insta-icon" />
      </div>
    </div>
    <div class="creditos">
      <p>Site desenvolvido para fins estudantis.</p>
    </div>
  </footer>
</body>
</html>
