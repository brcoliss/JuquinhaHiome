<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juquinha Pizzaria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <!-- Cabeçalho -->
  <header>
    <div class="container header-container">
      <div class="logo">
        <img src="img/Logo_opcao1-removebg-preview.png" alt="Juquinha Pizzaria">
      </div>
      <nav>
        <ul>
          <li><a href="#">HOME</a></li>
          <li><a href="#">QUEM SOMOS?</a></li>
          <li><a href="#">CARDÁPIO</a></li>
          <li><a href="#">INFORMAÇÕES</a></li>
        </ul>
      </nav>
    </div>
  </header>
 
  <!-- Conteúdo principal -->
  <main>
    <section class="destaque">
      <div class="container">
        <div class="caixa-branca"></div>
 
        <div class="telefone">
          <p>FAÇA SEU PEDIDO PELO NÚMERO:</p>
          <span>📞 (13) 9999-9999</span>
        </div>
 
        <div class="galeria">
          <img src="img/DeWatermark.ai_1751668371819.jpeg" alt="Pizza 1">
          <img src="img/Mídia (1).jpg" alt="Pizza 2">
          <img src="img/R (1).jpg" alt="Pizza 3">
        </div>
      </div>
    </section>
  </main>
 
  <!-- Rodapé -->
  <footer>
    <div class="container footer-container">
      <div class="footer-logo">
        <img src="img/logo2-png.png" alt="Juquinha Pizzaria">
      </div>
      <div class="footer-info">
        <p>📍 Av. Conselheiro Nébias, 309 - Vila Matias, Santos - SP, 11015-003</p>
        <p>Fale Conosco: (13) 9999-9999</p>
        <p><img src="instagram-icon.png" alt="Instagram" class="icon"> @juquinhapizza</p>
        <p class="footer-note">Site desenvolvido para fins estudantis.</p>
      </div>
    </div>
  </footer>
 
</body>
</html>
