<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juquinha Pizza em Pedaços</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="logo.png" alt="Logo Juquinha" />
    </div>
    <nav>
      <ul>
        <li><a class="active" href="#">HOME</a></li>
        <li><a href="#">QUEM SOMOS?</a></li>
        <li><a href="#">CARDÁPIO</a></li>
        <li><a href="#">INFORMAÇÕES</a></li>
      </ul>
    </nav>
  </header>
 
  <main>
    <section class="pizza-principal">
      <img src="img/normal-1024x683.jpg" alt="Pizza principal" />
    </section>
 
    <section class="pedido">
      <div class="botao-pedido">
        <span>📞 (13) 9999-9999</span>
        <p>FAÇA SEU PEDIDO PELO NÚMERO:</p>
      </div>
    </section>
 
    <section class="galeria">
      <img src="img/DeWatermark.ai_1751668371819.jpeg" alt="Pizza 1" />
      <img src="img/Mídia (1).jpg" alt="Pizza 2" />
      <img src="img/pizza-background-aod8q68ppfej0sm0.jpg" alt="Pizza 3" />
    </section>
  </main>
 
  <footer>
    <div class="footer-logo">
      <img src="img/logo2-png.png" alt="Logo Juquinha" />
    </div>
    <div class="footer-info">
      <p>📍 Av. Conselheiro Nébias, 309 - Vila Matias, Santos - SP, 11015-003</p>
      <p>📞 Fale Conosco: (13) 9999-9999</p>
      <p>📷 Instagram</p>
      <small>Site desenvolvido para fins estudantis.</small>
    </div>
  </footer>
</body>
</html>
